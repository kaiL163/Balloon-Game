services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airballoon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airballoon"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/airballoon
      DB_USER: postgres
      DB_PASSWORD: postgres
      ALLOWED_ORIGIN_PATTERNS: "${ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,http://95.81.82.159:5173,http://95.81.82.159,https://95.81.82.159}"
    ports:
      - "8080:8080"

volumes:
  pgdata:
